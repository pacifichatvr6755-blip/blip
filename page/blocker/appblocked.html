<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .block-container {
            width: 100%;
            max-width: 550px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 3rem 2rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .icon-shield {
            width: 72px;
            height: 72px;
            background-color: rgba(239, 68, 68, 0.1);
            border: 2px solid var(--danger);
            color: var(--danger);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            margin: 0 auto 1.75rem auto;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.75rem;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .details-box {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: left;
        }

        .details-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .details-row:last-child {
            margin-bottom: 0;
        }

        .btn-action {
            display: inline-block;
            background-color: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.8rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn-action:hover {
            background-color: var(--border);
            border-color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="block-container">
        <div class="icon-shield">✕</div>
        <h1>Blocked by BlipBlocker</h1>
        <p>The administrator has restricted access to this network resource. If you believe this is an error, please contact IT support.</p>
        
        <div class="details-box">
            <div class="details-row">
                <span>Status:</span>
                <span style="color: var(--danger);">Access_Denied</span>
            </div>
            <div class="details-row">
                <span>Filter Engine:</span>
                <span>BlipBlocker v4.1</span>
            </div>
            <div class="details-row">
                <span>Reason:</span>
                <span>Category Restriction</span>
            </div>
        </div>

        <button class="btn-action" onclick="window.history.back();">Go Back</button>
    </div>

</body>
</html>
